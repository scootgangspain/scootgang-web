
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCOOTGANG</title>
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 35px 15px;
      background: #171717;
      border-bottom: 3px solid #e50914;
    }
    h1 {
      color: #ff2636;
      font-size: 42px;
      margin: 10px 0;
    }
    .panel {
      background: #1c1c1c;
      border: 1px solid #444;
      border-radius: 15px;
      padding: 25px;
      margin: 30px auto;
      max-width: 400px;
    }
    button {
      background: #e50914;
      color: white;
      border: none;
      padding: 16px 25px;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }
    #estado {
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>
  
<header>
  <img
    src="D429C99F-3199-476A-95BB-5512C3CA2AB5.png"
    alt="SCOOTGANG"
    style="width:100%; max-width:700px; height:auto; display:block; margin:0 auto 10px;"
  >
  <p>Scooter Control Center</p>
</header>

  <div class="panel">
    <h2>Conexión Bluetooth</h2>
    <p>Panel de conexión para patinetes</p>
    <button onclick="conectar()">Conectar patinete</button>
    <button onclick="desconectar()">
  Desconectar
</button>
    <button onclick="explorarServicios()">
  Explorar Bluetooth
</button>
    <p id="estado">Desconectado</p>
  </div>

  
<script>
  let dispositivo = null;
  let servidor = null;

  const estado = () =>
    document.getElementById("estado");

  function desconectado() {
    servidor = null;
    estado().textContent =
      "Bluetooth desconectado";
  }

  async function conectar() {
    if (!navigator.bluetooth) {
      estado().textContent =
        "Web Bluetooth no disponible";
      return;
    }

    try {
      estado().textContent =
        "Buscando patinete...";

      dispositivo =
        await navigator.bluetooth.requestDevice({
          acceptAllDevices: true
        });

      estado().textContent =
        "Conectando con " +
        (dispositivo.name || "patinete") +
        "...";

      dispositivo.addEventListener(
        "gattserverdisconnected",
        desconectado
      );

      if (!dispositivo.gatt) {
        throw new Error(
          "El dispositivo no admite GATT desde este navegador"
        );
      }

      servidor = await dispositivo.gatt.connect();

      if (servidor.connected) {
        estado().textContent =
          "✅ Conectado: " +
          (dispositivo.name || "Patinete");
      } else {
        estado().textContent =
          "No se pudo conectar";
      }

    } catch (error) {
      estado().textContent =
        "Error: " + error.message;
    }
  }

  function desconectar() {
    if (dispositivo?.gatt?.connected) {
      dispositivo.gatt.disconnect();
    } else {
      desconectado();
    }
  }


async function explorarServicios() {
  const salida = document.getElementById("estado");

  if (!servidor || !servidor.connected) {
    salida.textContent = "Primero conecta el patinete";
    return;
  }

  try {
    salida.textContent = "Analizando Bluetooth...";

    const servicios = await servidor.getPrimaryServices();
    let resultado = "";

    for (const servicio of servicios) {
      resultado += "\nSERVICIO:\n" + servicio.uuid;

      try {
        const caracteristicas =
          await servicio.getCharacteristics();

        for (const c of caracteristicas) {
          resultado += "\n\nCaracterística:\n" + c.uuid;
          resultado += "\nLeer: " + c.properties.read;
          resultado += "\nEscribir: " + c.properties.write;
          resultado += "\nNotificaciones: " + c.properties.notify;
        }
      } catch (e) {
        resultado += "\nError: " + e.message;
      }

      resultado += "\n\n-----------------\n";
    }

    salida.style.whiteSpace = "pre-wrap";
    salida.style.overflowWrap = "anywhere";
    salida.textContent = resultado;

  } catch (error) {
    salida.textContent = "Error: " + error.message;
  }
}

</script>

</body>
</html>
